<!DOCTYPE html>
<html>
 
     <head>
     <title>personal portfolio</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="offering.css">
    <link rel="stylesheet" href="dashboard.css">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>

  <body>
    <div class="container">
    <div class="header">
        
       
          <img class="logo" src="efatha.png" style="width: 50px; height: auto;">
         <h2>EFATHA CHURCH</h2>
         
         
         <!--<button><i class="material-icons">language</i>EN</button>
         <button><i class="material-icons">menu</i></button>
         <p>Pay, offer & do to praise jesus</p>-->
        
      </div>
    <div class="offering">
    <form>
      <div class="input">
      <label>Name:</label>
      <input type="text" name="name" placeholder="" required><br>
      <label>Reg. No:</label>
      <input type="number" name="name" placeholder=""><br>
      <label>Region:</label>
      <input type="number" name="name" placeholder="" ><br>
      <label>Area:</label>  
      <input type="text" name="name" placeholder="" required><br>
      <label>Zone:</label>
      <input type="text" name="name" placeholder="" required><br>
      <label>Mobile:</label>
      <input type="number" name="name" placeholder="" required><br>
      
      </div>
     
      <div class="table">
        <table>
      <tr>
        <th>type</th>
        <th>Amount</th>
      </tr>
      <tr>
        <td>Offering</td>
        <td><input type="number" name="offering" id="offering"></td>
      </tr>
      <tr>
        <td>Gospel-TV</td>
        <td><input type="number" name="offering" id="gospel"></td>
      </tr>
      <tr>
        <td>Tithe</td>
        <td><input type="number" name="offering" id="tithe"></td>
      </tr>
      <tr>
        <td>Thanks Giving</td>
        <td><input type="number" name="offering" id="thanks"></td>
      </tr>
      <tr>
        <td>First Fruit</td>
        <td><input type="number" name="offering" id="first"></td>
      </tr>
      <tr>
        <td>Encounter</td>
        <td><input type="number" name="offering" id="encounter"></td>
      </tr>
      
     </table>
     
      </div>

     

     <div class="submit">
      <p>Total</p>
      <p id="show_total"></p>
      <button>submit</button>
     </div>

    </form>  
    </div>

    </div>

    <script src="dashboard.js"></script>
  </body>
</html>

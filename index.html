<!DOCTYPE html>
<html>
 
     <head>
     <title>efatha payment system</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>

  <body>
    <div class="container">
      <div class="header">
        <img src="efatha.png" class="logo" style="width: 50px; height: auto;">
        <h1>Efathapay</h1>
      </div>
      <div class="login">
        <p>welcome!</p>
        <p style="color: dodgerblue">login to continue</p>

        <form id="form">
          <input type="email" id="username" placeholder="enter your email" required><br>
          <input type="password" id="password" placeholder="enter password"><br>
          
          <p id="message"></p>

          <div class="buttons">
            <button type="submit" class="login_btn" id="login_btn" >login</button><br>
         
         <button class="register" id="reg_now">register now</button>
          </div>
          
        </form>

      </div>

    </div>

    <script src="efatha.js"></script>
  </body>
</html>

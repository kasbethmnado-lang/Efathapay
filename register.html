<!DOCTYPE html>
<html>
 
     <head>
     <title>personal portfolio</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>

  <body>
    
    <div class="reg_container">
      <form id="reg_form">
        <input type="text" id="name" placeholder="full name" required><br>
        <input type="email" id="reg_email" placeholder="enter email" required><br>
        <input type="password" id="reg_password" placeholder="create password" required><br>
         <input type="password" id="conf_password" placeholder="confirm password" required><br>

         <p id="message"></p>
         <p>Already have an account?<a href="index.html">Login</a></p>

         <button type="submit" class="reg_btn">register</button>

      </form>
    </div>
    <script src="register.js"></script>
  </body>
</html>
